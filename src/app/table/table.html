<div class="row">
  <div class="col-12">
    <div class="table-responsive">
      {{ nameList | json }}

      <table class="table table-bordered table-striped">
        <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Age</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody>
          @for (item of nameList; track item.name) {
            <tr>
              <td>1</td>
              <td>dara</td>
              <td>20</td>
              <td>
                <input type="button" value="edit" class="btn btn-outline-warning m-1">
                <input type="button" value="delete" class="btn btn-outline-danger m-1">
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
