<div class="container">
  <div class="product-card">

    <div class="row">

      <!-- Product Image -->
      <div class="col-md-5 text-center">

        <img
          src="{{ image }}"
          class="product-image"
          alt="">

      </div>

      <!-- Product Info -->
      <div class="col-md-7">

                <span class="badge badge-primary category-badge">
                    Men's Clothing
                </span>

        <h2 class="mt-3">
         {{ pro_name }}
        </h2>

        <div class="rating mt-3">

          <i class="fas fa-star"></i>
          <i class="fas fa-star"></i>
          <i class="fas fa-star"></i>
          <i class="fas fa-star"></i>
          <i class="far fa-star"></i>

          <span class="text-dark ml-2">
                        3.9 (120 Reviews)
                    </span>

        </div>

        <div class="mt-4">

          <span class="price">$ {{ price }}</span>

        </div>

        <hr>

        <h5>Description</h5>

        <p class="description">
          {{ description }}
        </p>

        <div class="form-inline mt-4">

          <label class="mr-3 font-weight-bold">
            Quantity
          </label>

          <button class="btn btn-outline-secondary">-</button>

          <input
            type="text"
            class="form-control quantity-box mx-2"
            value="1">

          <button class="btn btn-outline-secondary">+</button>

        </div>

        <div class="mt-5">

          <button class="btn btn-warning btn-lg btn-cart mr-3">
            <i class="fas fa-shopping-cart"></i>
            Add to Cart
          </button>

          <button class="btn btn-danger btn-lg btn-buy">
            Buy Now
          </button>

        </div>

      </div>

    </div>

  </div>
</div>
