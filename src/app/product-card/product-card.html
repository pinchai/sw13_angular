<div class="card border-0 shadow-lg rounded-4 overflow-hidden h-100">

  <!-- Product Image -->
  <div class="position-relative">
    <img
      src="/product/{{ image }}"
      class="card-img-top"
      alt="Product Image"
      style="height: 250px; object-fit: cover;"
    >

    <!-- Badge -->
    <span
      class="badge bg-danger position-absolute top-0 start-0 m-3 px-3 py-2 rounded-pill">
      New
    </span>
  </div>

  <!-- Card Body -->
  <div class="card-body p-4">

    <!-- Title -->
    <h4 class="card-title fw-bold mb-2 product-name">
      {{ name }}
    </h4>

    <!-- Description -->
    <p class="card-text text-muted mb-4 product-description">
      {{ description }}
    </p>

    <!-- Price + Button -->
    <div class="d-flex justify-content-between align-items-center">

      <div>
        <span class="fs-4 fw-bold text-primary">$ {{ price }}</span>
      </div>

      <a href="#" class="btn btn-dark rounded-pill px-4">
        Buy Now
      </a>

    </div>
  </div>
</div>
