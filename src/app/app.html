<div class="container">
  <div class="row">
    <div class="card">
      <div class="card-body">
        <div class="form-group">
          <label>Name</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="name"
          >
        </div>
        <div class="form-group">
          <label>Age</label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="age"
          >
        </div>
        <input
          type="button"
          class="btn btn-outline-primary"
          value="Save"
          (click)="onSave()"
        >
      </div>
    </div>
  </div>
  <hr>
  <app-table [nameList]="name_list"></app-table>
</div>
